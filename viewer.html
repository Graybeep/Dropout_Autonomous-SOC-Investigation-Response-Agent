<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOC Agent - Trace Replay</title>
<style>
  /* Dark Mode (OLED) + Minimalism - the "Developer Tools" template from
     uupm.cc/demo/developer-tools, tokens read off the rendered demo rather
     than eyeballed: ground #0D0D0D, panel #1E1E1E, zinc text, one neon-green
     accent (#39FF14) on black.

     Two deliberate departures from that demo, both because it is a LANDING
     page and this is a dense 43-step trace:
       - its airy hero spacing is not adopted; density stays Swiss-tight.
       - neon green is reserved for brand + interaction + tool calls. Semantic
         states use the Dracula set the demo itself uses in its code block, so
         "this failed" never has to be told apart from "this is a button".
     No webfont is loaded: IBM Plex Sans is requested and degrades to the
     system stack, keeping the viewer at zero external references (L-2).

     --dim2 is #8A8A94, not the demo's zinc-500 #71717A: measured on this
     card ground that token gives 3.74:1, under AA for the uppercase micro
     labels it colours. Lifted until it cleared 4.5:1. Measured, not eyeballed. */
  :root{
    --bg:#0D0D0D; --panel:#161616; --panel2:#0A0A0A; --line:rgba(255,255,255,.10);
    --ink:#E4E4E7; --dim:#A1A1AA; --dim2:#8A8A94;
    --accent:#39FF14; --accent-ink:#000000;
    --ok:#50FA7B; --warn:#F1FA8C; --bad:#FF5555;
    --purple:#BD93F9; --cyan:#8BE9FD;
    --ok-bg:#0C1F12; --bad-bg:#24100F; --warn-bg:#211E0C; --dim-bg:#1E1E1E;
    --r:6px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.55 "IBM Plex Sans",Inter,ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  code,pre,.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

  header{position:sticky;top:0;z-index:20;background:rgba(13,13,13,.94);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 22px}
  .bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:600;letter-spacing:-.2px}
  h1 span{color:var(--dim);font-weight:400}
  select,button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:var(--r);padding:7px 12px;font-size:13px;font-family:inherit;cursor:pointer}
  select{min-width:290px}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.4;cursor:default}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
  .grow{flex:1}

  .meta{margin:0}
  .summary{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:var(--r);padding:13px 15px;color:var(--dim);font-size:13px;margin-top:14px}
  .summary b{color:var(--ink)}

  .verdicts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
  .verdict{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:11px 14px;min-width:172px;flex:1}
  .verdict .k{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim2)}
  .verdict .v{font-size:19px;font-weight:600;margin-top:3px;letter-spacing:-.3px}
  .vhd{display:flex;align-items:center;gap:9px;padding-bottom:8px;margin-bottom:8px;
    border-bottom:1px solid var(--line)}
  .vid{font-size:11.5px;color:var(--dim);letter-spacing:.3px}
  .vr{display:flex;align-items:baseline;gap:10px;padding:2.5px 0}
  .vk{flex:0 0 84px;font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim2)}
  .vv{font-size:12.5px;color:var(--ink)}

  main{min-width:0}
  .tl{position:relative;padding-left:30px}
  .tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}

  .step{position:relative;margin:0 0 11px;opacity:0;transform:translateY(5px);
    transition:opacity .3s,transform .3s}
  .step.on{opacity:1;transform:none}
  /* Base rail marker. This rule is load-bearing: a pseudo-element with no
     `content` generates no box at all, so without it every .k-*::before and
     [data-refused]::before rule below is dead CSS that paints nothing. The
     default is a round dot on the rail; the kind rules override shape. */
  .step::before{content:"";position:absolute;left:-24.5px;top:14px;width:9px;height:9px;
    border-radius:50%;background:var(--line);z-index:1}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px}
  .lbl{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim2);
    display:flex;gap:9px;align-items:center;margin-bottom:5px}
  .txt{white-space:pre-wrap}

  /* kinds */
  .k-state::before{background:var(--purple);width:13px;height:13px;left:-27px}
  .k-state .card{background:transparent;border:0;padding:3px 0}
  .k-state .name{font-size:11.5px;letter-spacing:1.7px;color:var(--purple);font-weight:700}
  .k-state .note{color:var(--dim2);font-size:12.5px;margin-top:1px}

  .k-thought::before,.k-sufficiency::before{background:var(--cyan)}
  .k-thought .card,.k-sufficiency .card{border-left:3px solid var(--cyan)}
  .k-sufficiency .lbl{color:var(--cyan)}

  .k-tool_call::before{background:var(--accent)}
  .k-tool_call .card{border-left:3px solid var(--accent)}
  .sig{color:var(--accent);font-weight:600;background:var(--dim-bg);border:1px solid var(--line);
    border-radius:4px;padding:1px 7px;display:inline-block}
  .reason{color:var(--dim);margin-top:5px;font-size:13px}
  .reason b{color:var(--dim2);font-weight:600}

  .k-tool_result::before{background:var(--ok)}
  .step[data-refused="1"]::before{background:var(--bad);border-radius:2px}
  .step[data-refused="1"] .card{border-left:3px solid var(--bad);background:var(--bad-bg)}
  .k-tool_result .card{border-left:3px solid #1F3D26;background:var(--panel2)}
  .k-tool_failure::before{background:var(--bad)}
  .k-tool_failure .card{border-left:3px solid var(--bad);background:var(--bad-bg)}
  .k-error::before{background:var(--bad)}
  .k-error .card{border-left:3px solid var(--bad);background:var(--bad-bg)}

  .k-scoring::before{background:var(--warn)}
  .k-scoring .card{border-left:3px solid var(--warn)}
  .k-conclusion::before{background:var(--ok);width:13px;height:13px;left:-27px}
  .k-conclusion .card{border-left:3px solid var(--ok);background:var(--ok-bg)}
  .k-action::before{background:var(--warn)}
  .k-action .card{border-left:3px solid var(--warn);background:var(--warn-bg)}
  .k-verification::before{background:var(--ok)}
  .k-verification .card{border-left:3px solid var(--ok)}

  /* reconsideration fork */
  .k-reconsider::before,.k-event::before{background:var(--purple);width:13px;height:13px;left:-27px}
  .k-reconsider .card,.k-event .card{border:1px dashed var(--purple);background:#171528}
  .fork{display:flex;align-items:center;gap:9px;color:var(--purple);font-weight:700;
    font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase}
  .fork::before{content:"";flex:0 0 26px;height:2px;background:var(--purple);
    box-shadow:0 -6px 0 var(--purple)}

  /* Rail markers carry SHAPE as well as hue, so the kind survives greyscale,
     projector colour shift and colour-blind viewers. Declared AFTER the kind
     rules above so it wins on equal specificity. The card label repeats the
     kind in words - the marker is reinforcement, never the only signal. */
  .k-tool_failure::before,.k-error::before{border-radius:2px}
  .k-conclusion::before,.k-scoring::before{border-radius:2px;transform:rotate(45deg)}
  .k-reconsider::before,.k-event::before{background:var(--bg);border-radius:50%;
    box-shadow:inset 0 0 0 3px var(--purple)}
  .k-state::before{width:5px;height:18px;left:-23.5px;border-radius:2px;
    background:var(--purple)}
  .step[data-refused="1"]::before{background:var(--bad);border-radius:2px;
    transform:rotate(45deg)}

  table{border-collapse:collapse;width:100%;margin-top:8px;font-size:12.5px}
  th,td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
  th{color:var(--dim2);font-weight:600;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase}
  td.d{white-space:nowrap;font-weight:650}
  .pos{color:var(--ok)} .neg{color:var(--bad)}

  .pill{display:inline-block;padding:1.5px 8px;border-radius:99px;font-size:11px;
    font-weight:650;letter-spacing:.4px}
  .p-ok{background:var(--ok-bg);color:var(--ok)} .p-bad{background:var(--bad-bg);color:var(--bad)}
  .p-warn{background:var(--warn-bg);color:var(--warn)} .p-dim{background:var(--dim-bg);color:var(--dim)}

  .side{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:9px}
  .side>div{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px}
  .side .h{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim2);margin-bottom:4px}

  details{margin-top:7px}
  .refusal{margin:8px 0 4px;border-left:2px solid var(--bad);padding-left:10px}
  .refusal-item{color:var(--ink);font-size:12.5px;line-height:1.5;margin-bottom:6px}
  .refusal-item:last-child{margin-bottom:0}
  .refusal-meta{color:var(--dim2);font-size:11px;margin-top:6px}
  summary{cursor:pointer;color:var(--dim2);font-size:12px;user-select:none}
  summary:hover{color:var(--accent)}
  pre{background:#000000;border:1px solid var(--line);border-radius:6px;padding:9px;
    overflow:auto;font-size:11.5px;color:var(--dim);margin:6px 0 0;max-height:300px}
  .txt code,.reason code{background:#000000;border:1px solid var(--line);
    border-radius:4px;padding:0 4px;font-size:12px;color:var(--cyan)}
  .txt strong,.reason strong{color:var(--ink);font-weight:650}
  .mdh{display:block;color:var(--ink);font-weight:650;margin-top:4px}
  .case-tag{margin-left:auto;font-size:10.5px;color:var(--dim2);letter-spacing:.5px}
  .empty{color:var(--dim2);text-align:center;padding:60px 20px}
  /* ---- SaaS app shell -------------------------------------------------
     The uupm gallery demos are all marketing pages, so there was no app
     layout to lift; this is the standard SaaS shell (fixed sidebar nav,
     sticky topbar, KPI row, panelled content) built on the DevKit OLED
     tokens above. The KPI grid is the one pattern taken from the gallery's
     SaaS Analytics demo (4-up auto-fit cards, 12-16px gap). */
  .app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}

  .sidebar{background:#080808;border-right:1px solid var(--line);position:sticky;
    top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
  .brand{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;
    align-items:center;gap:10px}
  .brand .dot{flex:0 0 9px;height:9px;background:var(--accent);border-radius:2px;
    box-shadow:0 0 10px rgba(57,255,20,.5)}
  .brand .bt{font-weight:600;font-size:13.5px;letter-spacing:-.2px;line-height:1.25}
  .brand .bs{display:block;color:var(--dim2);font-weight:400;font-size:10.5px;
    letter-spacing:.5px;text-transform:uppercase}
  .nav-label{padding:15px 18px 7px;font-size:10px;letter-spacing:1.1px;
    text-transform:uppercase;color:var(--dim2)}
  .nav{padding:0 10px;flex:1}
  .nav a{display:flex;gap:9px;align-items:center;padding:7px 9px;border-radius:var(--r);
    color:var(--dim);text-decoration:none;font-size:12.5px;margin-bottom:2px;
    border:1px solid transparent}
  .nav a:hover{background:#131313;color:var(--ink)}
  .nav a.active{background:#131313;color:var(--ink);border-color:var(--line)}
  .nav a.active .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .nav .n{flex:0 0 19px;height:19px;display:grid;place-items:center;font-size:10.5px;
    font-weight:650;border:1px solid var(--line);border-radius:4px;color:var(--dim2)}
  .nav .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav .b{font-size:9px;letter-spacing:.4px;padding:1px 5px;border-radius:3px;
    font-weight:700;border:1px solid transparent}
  .sidebar-foot{padding:11px 18px;border-top:1px solid var(--line);font-size:10.5px;
    color:var(--dim2);line-height:1.6}

  .main-col{min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(13,13,13,.95);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:11px 24px;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
  .crumb{font-size:13.5px;font-weight:600;letter-spacing:-.2px}
  .crumb i{color:var(--dim2);font-style:normal;font-weight:400}
  .content{padding:20px 24px 120px;width:100%;max-width:1160px}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:12px 14px}
  .stat .k{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dim2)}
  .stat .v{font-size:19px;font-weight:600;margin-top:5px;letter-spacing:-.4px}
  .stat .s{font-size:11px;color:var(--dim2);margin-top:3px}

  .panel{background:#111111;border:1px solid var(--line);border-radius:var(--r);margin-top:14px}
  .panel-hd{padding:11px 16px;border-bottom:1px solid var(--line);font-size:10.5px;
    letter-spacing:1.1px;text-transform:uppercase;color:var(--dim2);
    display:flex;align-items:center;gap:9px}
  .panel-hd .grow{flex:1}
  .panel-bd{padding:16px}

  @media(max-width:900px){
    .app{grid-template-columns:1fr}
    .sidebar{position:static;height:auto}
    .nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px}
    .sidebar-foot{display:none}
  }
  @media(max-width:640px){.side{grid-template-columns:1fr}select{min-width:0;width:100%}}
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <span class="dot"></span>
      <span class="bt">SOC Agent<span class="bs">trace replay</span></span>
    </div>
    <div class="nav-label">Scenarios</div>
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-foot" id="foot"></div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <span class="crumb" id="crumb">&nbsp;</span>
      <span class="grow"></span>
      <button id="play" class="primary">Play</button>
      <button id="all">Show all</button>
      <button id="reset">Reset</button>
      <span id="count" class="mono" style="color:var(--dim2);font-size:12px"></span>
    </header>

    <div class="content">
      <div id="stats" class="stats"></div>
      <div class="meta">
        <div id="summary" class="summary"></div>
      </div>

      <section class="panel">
        <div class="panel-hd">Cases</div>
        <div class="panel-bd"><div id="verdicts" class="verdicts"></div></div>
      </section>

      <section class="panel">
        <div class="panel-hd">Investigation timeline<span class="grow"></span>
          <span id="tlmeta"></span></div>
        <div class="panel-bd"><main><div id="tl" class="tl"></div></main></div>
      </section>
    </div>
  </div>

</div>

<!-- Motion, vendored rather than pulled from a CDN. The demo runs from a local
     http.server and may have no internet; a CDN miss would leave `Motion`
     undefined mid-demo. Every use below is feature-detected anyway. -->
<script src="vendor/motion.js"></script>
<script>
const SCENARIOS = [
  ["1","Scenario 1 - False alarm, patched host"],
  ["2","Scenario 2 - True positive, unpatched host"],
  ["3","Scenario 3 - Delayed evidence, re-hypothesise"],
  ["4","Scenario 4 - Human override"],
  ["5","Scenario 5 - Multi-alert correlation"],
  ["6","Scenario 6 - Tool failure, degraded recovery"],
  ["7","Scenario 7 - Configuration prevents exploitation"],
];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pill = (t, k) => `<span class="pill p-${k}">${esc(t)}</span>`;

// The model writes light markdown in its prose (**bold**, `code`). Render just
// those two, always AFTER escaping so nothing user-supplied becomes markup.
const md = s => esc(s)
  .replace(/^\s*#{1,6}\s+(.+)$/gm, '<span class="mdh">$1</span>')
  .replace(/^\s*&gt;\s+/gm, "")
  .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
  .replace(/`([^`\n]+)`/g, "<code>$1</code>");

let steps = [], timer = null, shown = 0;

// Motion is optional: if the vendored file is missing the CSS transition still
// reveals every card, so the viewer degrades instead of breaking.
const M = window.Motion || null;
const STILL = matchMedia("(prefers-reduced-motion: reduce)").matches;
const canAnimate = () => !!(M && M.animate) && !STILL;

// "Animate 1-2 key elements per view maximum" - so exactly two things move:
// the card being revealed, and a reconsideration fork or guard refusal when
// one appears. Nothing else.
function enter(el, i = 0) {
  if (!canAnimate()) return;
  // Deliberately does NOT animate opacity. The `.on` class already fades the
  // card in via CSS; if Motion also drove opacity from 0 and failed to run or
  // complete - a stalled rAF, a missing vendor file, a headless renderer - the
  // card would sit invisible with the class set. Motion only adds MOVEMENT on
  // top of a reveal that already works without it.
  const fork = el.classList.contains("k-reconsider") || el.classList.contains("k-event");
  const refused = el.dataset.refused === "1";
  M.animate(el,
    fork ? { x: [-18, 0] } : { y: [10, 0] },
    { duration: fork ? 0.42 : 0.34, delay: i * 0.045,
      ease: fork ? [0.34, 1.4, 0.64, 1] : [0.22, 1, 0.36, 1] });
  const card = el.querySelector(".card");
  if (!card) return;
  if (fork) M.animate(card,
    { borderColor: ["var(--purple)", "rgba(167,139,250,.35)"] }, { duration: .9 });
  if (refused) M.animate(card,
    { boxShadow: ["0 0 0 0 rgba(220,38,38,0)", "0 0 0 3px rgba(220,38,38,.38)",
                  "0 0 0 0 rgba(220,38,38,0)"] }, { duration: 1.1 });
}

// Sidebar nav replaces the old <select>. Badges are filled in lazily after
// the first trace renders (fillBadges), so a slow prefetch can never delay
// the page the demo actually opens on.
const SHORT = {
  "1":"False alarm, patched", "2":"True positive, unpatched",
  "3":"Delayed evidence", "4":"Human override",
  "5":"Multi-alert correlation", "6":"Tool failure recovery",
  "7":"Configuration prevents"
};
$("nav").innerHTML = SCENARIOS.map(([k]) =>
  `<a href="#${k}" data-k="${k}"><span class="n">${k}</span>
   <span class="t">${esc(SHORT[k] || "Scenario " + k)}</span>
   <span class="b" data-badge="${k}"></span></a>`).join("");

function setActive(k){
  $("nav").querySelectorAll("a").forEach(a =>
    a.classList.toggle("active", a.dataset.k === k));
}

const BADGE_TEXT = {SUCCEEDED:"SUCC", FAILED:"FAIL", INCONCLUSIVE:"INC"};
async function fillBadges(){
  for (const [k] of SCENARIOS){
    try {
      const r = await fetch(`traces/scenario_${k}.json`);
      if (!r.ok) continue;
      const d = await r.json();
      const c = (d.cases || [])[0];
      const o = c?.conclusions?.[c.conclusions.length - 1]?.outcome;
      const el = $("nav").querySelector(`[data-badge="${k}"]`);
      if (BADGE_TEXT[o] && el){
        el.textContent = BADGE_TEXT[o];
        el.style.color = `var(--${outcomeKind(o)})`;
        el.style.borderColor = `var(--${outcomeKind(o)})`;
      }
    } catch (e) { /* a missing trace just leaves the badge blank */ }
  }
}

// SUCCEEDED means the ATTACK succeeded, so it is the bad news and FAILED is
// the good news. Everything that colours an outcome derives it from here -
// the sidebar badge originally duplicated this mapping and inverted it.
function outcomeKind(o){
  return o === "SUCCEEDED" ? "bad" : o === "FAILED" ? "ok"
       : o === "INCONCLUSIVE" ? "warn" : "dim";
}
function outcomePill(o){ return pill(o, outcomeKind(o)); }

function argsOf(a){
  if (!a) return "";
  // submit_assessment's full payload is rendered properly by the scoring and
  // conclusion steps; inline it would drown the timeline.
  return Object.entries(a).filter(([k]) => k !== "reason").map(([k,v]) => {
    if (k === "factors" && Array.isArray(v))
      return `factors=[${v.map(f => f && f.factor).join(", ")}]`;
    let t = JSON.stringify(v);
    if (t && t.length > 80) t = t.slice(0, 79) + '…"';
    return `${k}=${t}`;
  }).join(", ");
}

function render(s){
  const k = s.kind;
  const tag = s.case_id ? `<span class="case-tag">${esc(s.case_id)}</span>` : "";

  if (k === "state_change")
    return `<div class="name">${esc(s.state)}</div>`+
           (s.note ? `<div class="note">${esc(s.note)}</div>` : "");

  if (k === "scenario_meta") return null;

  if (k === "thought" || k === "sufficiency")
    return `<div class="lbl">${k === "sufficiency" ? "Sufficiency assessment" : "Reasoning"}${tag}</div>
            <div class="txt">${md(s.text)}</div>`;

  if (k === "tool_call") {
    // submit_assessment carries the full hypothesis, sufficiency and
    // disconfirmation text; all three are rendered properly by the conclusion
    // card a few steps later, so show only the factors it declared. It also
    // has no `reason` parameter by design, so suppress the Why line.
    const args = s.tool === "submit_assessment"
      ? `factors=[${(s.args?.factors || []).map(f => f && f.factor).join(", ")}]`
      : argsOf(s.args);
    const why = (s.reason && s.reason !== "(no stated reason)")
      ? `<div class="reason"><b>Why:</b> ${md(s.reason)}</div>` : "";
    return `<div class="lbl">Tool call${s.attempt > 1 ? ` &middot; attempt ${s.attempt}` : ""}${tag}</div>
      <div class="mono sig">${esc(s.tool)}(${esc(args)})</div>${why}`;
  }

  if (k === "tool_result"){
    const st = s.status || "ok";
    const p = st === "ok" ? "ok" : st === "no_data" ? "warn"
            : st === "rejected" ? "bad" : "dim";
    // A refusal's WHOLE content is its `problems` list - collapsing that behind
    // "inspect payload" hid the one artefact the trace exists to show. Surface
    // it inline; the raw payload stays available underneath.
    const probs = (s.result && s.result.problems) || [];
    const refusal = probs.length
      ? `<div class="refusal">${probs.map(x =>
          `<div class="refusal-item">${md(x)}</div>`).join("")}
         ${s.result.remaining_attempts != null
            ? `<div class="refusal-meta">attempt ${esc(s.result.attempt)} &middot;
               ${esc(s.result.remaining_attempts)} remaining</div>` : ""}</div>`
      : "";
    return `<div class="lbl">Result ${pill(st, p)}${tag}</div>${refusal}
      <details><summary>inspect payload</summary>
      <pre>${esc(JSON.stringify(s.result, null, 2))}</pre></details>`;
  }

  if (k === "tool_failure"){
    const r = s.result || {};
    return `<div class="lbl">Tool failure ${pill(r.status || "unavailable","bad")}${tag}</div>
      <div class="mono sig" style="color:var(--bad)">${esc(s.tool)} &mdash; ${esc(r.reason||"")}</div>
      <div class="reason">${esc(r.detail||"")}</div>`;
  }

  if (k === "scoring"){
    const rows = (s.applied_factors||[]).map(f =>
      `<tr><td>${esc(f.label)}</td>
       <td class="d ${f.delta>0?"pos":"neg"}">${f.delta>0?"+":""}${f.delta.toFixed(2)}</td>
       <td>${esc(f.citation)}</td></tr>`).join("")
      || `<tr><td colspan="3" style="color:var(--dim2)">no factors declared</td></tr>`;
    return `<div class="lbl">Deterministic scoring${tag}</div>
      <table><tr><th>Evidence finding</th><th>&Delta;</th><th>Citation</th></tr>${rows}</table>
      <div class="reason" style="margin-top:9px">
        base ${s.base.toFixed(2)} &rarr; raw <b>${s.raw_sum>0?"+":""}${s.raw_sum.toFixed(2)}</b>
        &rarr; score <b>${s.score.toFixed(2)}</b> &rarr; ${outcomePill(s.outcome)}
        confidence <b>${s.confidence.toFixed(2)}</b></div>
      ${s.ceiling_note ? `<div class="reason" style="color:var(--warn);margin-top:7px">
        <b>Ceiling:</b> ${esc(s.ceiling_note)}</div>` : ""}`;
  }

  if (k === "conclusion")
    return `<div class="lbl">Conclusion &middot; ${esc(s.label)}${tag}</div>
      <div style="font-size:16px;font-weight:650">${outcomePill(s.outcome)}
        <span style="color:var(--dim);font-size:13px">score ${s.score.toFixed(2)}
        &middot; confidence ${s.confidence.toFixed(2)}</span></div>
      <div class="reason"><b>Hypothesis:</b> ${md(s.hypothesis)}</div>
      ${s.sufficiency?`<div class="reason"><b>Sufficiency:</b> ${md(s.sufficiency)}</div>`:""}
      ${s.disconfirming_evidence_checked?`<div class="reason">
        <b>Disconfirming check:</b> ${md(s.disconfirming_evidence_checked)}</div>`:""}`;

  if (k === "action"){
    if (s.skipped)
      return `<div class="lbl">Action withheld ${pill("guardrail 6","warn")}${tag}</div>
              <div class="txt">${md(s.detail)}</div>`;
    if (s.decision)
      return `<div class="lbl">Human override applied${tag}</div>
        <div>Decision ${pill(s.decision, s.decision==="benign"?"ok":"bad")}
        &rarr; status <b>${esc(s.resulting_status)}</b></div>
        <div class="reason"><b>Justification:</b> ${esc(s.justification)}</div>`;
    return `<div class="lbl">Action${tag}</div>
            <div class="txt">${md(s.detail || s.action || "")}</div>`;
  }

  if (k === "verification"){
    const ok = s.matches_policy;
    return `<div class="lbl">Verification ${pill(ok?"matches policy":"MISMATCH", ok?"ok":"bad")}${tag}</div>
      <div class="reason">Re-read firewall state from disk for <b>${esc(s.ip)}</b>:
        expected blocked <b>${s.expected_blocked}</b>, observed <b>${s.blocked_after}</b>.</div>
      ${s.record?`<div class="reason mono" style="font-size:12px">rule: ${esc(s.record.rule)}
        ${s.record.precautionary?pill("precautionary","warn"):""}</div>`:""}`;
  }

  if (k === "event")
    return `<div class="fork">${esc(s.event_kind || "event")}</div>
            <div class="txt" style="margin-top:6px">${md(s.detail)}</div>`;

  if (k === "reconsider"){
    const p = s.prior_conclusion;
    return `<div class="fork">Reconsider &middot; ${esc(s.trigger)}</div>
      <div class="txt" style="margin-top:6px">${md(s.detail)}</div>
      <div class="side">
        <div><div class="h">Prior conclusion</div>
          ${p?`${outcomePill(p.outcome)} <span style="color:var(--dim)">
          confidence ${p.confidence.toFixed(2)}</span>
          <div class="reason">${esc(p.hypothesis)}</div>`:"<span style='color:var(--dim2)'>none</span>"}</div>
        <div><div class="h">After this trigger</div>
          <span style="color:var(--dim)">re-entering HYPOTHESIZE &mdash;
          the agent gathers new evidence before re-scoring</span></div>
      </div>`;
  }

  if (k === "error")
    return `<div class="lbl">Error${tag}</div><div class="txt">${esc(s.detail)}</div>`;

  return `<div class="lbl">${esc(k)}${tag}</div>
          <pre>${esc(JSON.stringify(s, null, 2))}</pre>`;
}

function paint(){
  const tl = $("tl");
  tl.innerHTML = "";
  steps.forEach((s, i) => {
    // The control plane logs the trigger as an EVENT and reconsider()
    // logs it again on the fork card. Render it once.
    const nxt = steps[i + 1];
    if (s.kind === "event" && nxt && nxt.kind === "reconsider"
        && (nxt.detail || "") === (s.detail || "")) return;
    const html = render(s);
    if (html === null) return;
    const d = document.createElement("div");
    d.className = `step k-${s.kind}`;
    // The guard refusal is the demo's set piece - flag it so it gets the one
    // extra animation the motion budget allows.
    if (s.kind === "tool_result" && s.status === "rejected") d.dataset.refused = "1";
    d.innerHTML = `<div class="card">${html}</div>`;
    tl.appendChild(d);
  });
}

function reveal(n){
  const els = document.querySelectorAll(".step");
  const fresh = [];
  els.forEach((e, i) => {
    const was = e.classList.contains("on");
    const now = i < n;
    e.classList.toggle("on", now);
    if (now && !was) fresh.push(e);
  });
  // Stagger only when several appear at once (Show all); a single step during
  // playback animates immediately so it stays in step with the 400ms cadence.
  fresh.forEach((e, i) => enter(e, fresh.length > 1 ? Math.min(i, 12) : 0));
  shown = n;
  $("count").textContent = `${Math.min(n, els.length)} / ${els.length} steps`;
  if (n && n <= els.length && els[n-1]) {
    const r = els[n-1].getBoundingClientRect();
    if (r.bottom > innerHeight - 40 || r.top < 90)
      els[n-1].scrollIntoView({behavior:"smooth", block:"center"});
  }
}

function stop(){ clearInterval(timer); timer = null; $("play").textContent = "Play"; }

$("play").onclick = () => {
  const total = document.querySelectorAll(".step").length;
  if (timer) return stop();
  if (shown >= total) reveal(0);
  $("play").textContent = "Pause";
  timer = setInterval(() => {
    if (shown >= total) return stop();
    reveal(shown + 1);
  }, 400);
};
$("all").onclick = () => { stop(); reveal(document.querySelectorAll(".step").length); };
$("reset").onclick = () => { stop(); reveal(0); };

async function load(key){
  stop();
  $("tl").innerHTML = `<div class="empty">loading&hellip;</div>`;
  $("verdicts").innerHTML = "";
  let data;
  try {
    const r = await fetch(`traces/scenario_${key}.json`);
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
  } catch (e) {
    $("summary").innerHTML = `<b>traces/scenario_${key}.json not found.</b>
      Run <code>python run_all.py</code> to generate it.
      If you opened this file directly, serve the folder instead:
      <code>python -m http.server 8000</code>, then open
      <code>http://localhost:8000/viewer.html</code> (browsers block
      <code>fetch</code> on <code>file://</code> URLs).`;
    $("tl").innerHTML = `<div class="empty">no trace loaded</div>`;
    $("count").textContent = "";
    $("stats").innerHTML = "";
    $("crumb").innerHTML = `Scenario ${esc(key)} <i>&middot; trace missing</i>`;
    return;
  }

  const meta = (data.steps || []).find(s => s.kind === "scenario_meta");
  // Expectation notes run to a paragraph on the scenarios that need one
  // (scenario 7 is a full diagnosis). Inline, that buries the summary under a
  // grey wall, so anything long collapses behind a disclosure.
  const exp = meta?.expectation;
  const notes = exp?.notes || "";
  const expHtml = !exp ? "" : (notes.length > 220
    ? `<details style="margin-top:6px"><summary>Expected: ${esc(exp.outcome)}
         &middot; why this is declared</summary>
       <div style="color:var(--dim2);margin-top:6px">${esc(notes)}</div></details>`
    : `<br><span style="color:var(--dim2)">Expected: ${esc(exp.outcome)}${
         notes ? " &middot; " + esc(notes) : ""}</span>`);

  $("summary").innerHTML = `<b>${esc(data.title || "")}</b><br>${esc(data.summary || "")}
    ${expHtml}
    ${data.error ? `<br><span style="color:var(--bad)">Run error: ${esc(data.error)}</span>` : ""}`;

  $("verdicts").innerHTML = (data.cases || []).map(c => {
    const last = c.conclusions?.[c.conclusions.length - 1];
    const act = (c.actions || []).map(a =>
      a.action + (a.precautionary ? " (precautionary)" : "")).join(", ") || "none";
    const row = (k, v, color) =>
      `<div class="vr"><span class="vk">${k}</span>
       <span class="vv"${color ? ` style="color:${color}"` : ""}>${v}</span></div>`;
    return `<div class="verdict">
      <div class="vhd"><span class="vid mono">${esc(c.case_id)}</span>
        ${last ? outcomePill(last.outcome) : pill("no conclusion","dim")}</div>
      ${row("status", esc(c.status))}
      ${row("action", esc(act))}
      ${last ? row("confidence",
        `${Number(last.confidence).toFixed(2)} <span style="color:var(--dim2)">/ score ${
          Number(last.score).toFixed(2)}</span>`) : ""}
      ${c.degraded_sources?.length
        ? row("degraded", esc(c.degraded_sources.join(", ")), "var(--bad)") : ""}
    </div>`;
  }).join("");

  steps = data.steps || [];

  // KPI row. Every figure is derived from the trace, never hardcoded.
  const calls    = steps.filter(x => x.kind === "tool_call" && x.tool !== "submit_assessment").length;
  const refusals = steps.filter(x => x.kind === "tool_result" && x.status === "rejected").length;
  const recons   = steps.filter(x => x.kind === "reconsider").length;
  const secs     = steps.length ? steps[steps.length - 1].t : 0;
  const c0       = (data.cases || [])[0];
  const concl    = c0?.conclusions?.[c0.conclusions.length - 1];
  const degraded = [...new Set((data.cases || []).flatMap(c => c.degraded_sources || []))];

  $("stats").innerHTML = [
    [`Outcome`, concl ? outcomePill(concl.outcome) : pill("none","dim"),
      (data.cases || []).length > 1 ? `${data.cases.length} cases` : (c0?.case_id || "")],
    [`Confidence`, concl ? Number(concl.confidence).toFixed(2) : "&mdash;",
      concl ? `score ${Number(concl.score).toFixed(2)}` : ""],
    [`Evidence calls`, calls, `${steps.length} trace steps`],
    [`Guard refusals`, refusals,
      refusals ? "resolved before concluding" : "none on this case"],
    [`Reconsiderations`, recons, recons ? "case re-opened" : "single pass"],
    [`Wall clock`, `${secs.toFixed(1)}s`,
      degraded.length ? `degraded: ${esc(degraded.join(", "))}` : "no source failed"],
  ].map(([k, v, sub]) =>
    `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div>
     <div class="s">${sub || "&nbsp;"}</div></div>`).join("");

  $("crumb").innerHTML = `${esc(data.title || "Scenario " + key)}
    <i>&middot; scenario ${esc(key)}</i>`;
  $("tlmeta").innerHTML = `<span style="color:var(--dim2);font-size:10.5px">${
    steps.length} steps</span>`;

  paint();
  // Show the whole trace by default. Opening on an empty timeline (with the
  // hidden steps still occupying layout) reads as a broken page; Play restarts
  // the reveal from the top for the demo.
  reveal(document.querySelectorAll(".step").length);
  scrollTo({top: 0});
}

// Deep-link support: viewer.html#3 opens scenario 3 directly, so a demo can
// jump straight to a scenario without touching the dropdown.
function fromHash() {
  const k = location.hash.replace("#", "");
  return SCENARIOS.some(([v]) => v === k) ? k : SCENARIOS[0][0];
}

addEventListener("hashchange", () => {
  const k = fromHash();
  if (k !== current) { current = k; setActive(k); load(k); }
});
$("foot").innerHTML =
  `<b style="color:var(--dim)">${SCENARIOS.length} scenarios</b><br>` +
  `traces replayed from disk<br>` +
  `<span style="color:var(--dim2)">no model runs in this view</span>`;

let current = fromHash();
setActive(current);
load(current).then(fillBadges);
</script>
</body>
</html>
