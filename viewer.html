<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOC Agent - Trace Replay</title>

<meta name="description" content="Replay a recorded investigation step by step: every tool call, guard refusal, reconsideration and verified action.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SOC Agent">
<meta property="og:title" content="SOC Agent: trace viewer">
<meta property="og:description" content="Replay a recorded investigation step by step: every tool call, guard refusal, reconsideration and verified action.">
<meta property="og:url" content="https://soc-agent-trace-viewer.vercel.app/viewer.html">
<meta property="og:image" content="https://soc-agent-trace-viewer.vercel.app/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <a class="brand" href="index.html" title="Back to the overview">
      <span class="dot"></span>
      <span class="bt">SOC Agent<span class="bs">&larr; overview</span></span>
    </a>
    <div class="nav-label">Scenarios</div>
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-foot" id="foot"></div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <h1 class="crumb" id="crumb">&nbsp;</h1>
      <span class="grow"></span>
      <button id="play" class="primary">Start</button>
      <button id="all">Show all</button>
      <button id="reset">Reset</button>
      <span id="count" class="mono count"></span>
    </header>

    <div class="content">
      <div id="stats" class="stats"></div>
      <div class="meta">
        <div id="summary" class="summary"></div>
      </div>

      <section class="panel">
        <div class="panel-hd">Cases</div>
        <div class="panel-bd"><div id="verdicts" class="verdicts"></div></div>
      </section>

      <section class="panel">
        <div class="panel-hd">Investigation timeline<span class="grow"></span>
          <span id="tlmeta"></span></div>
        <div class="panel-bd"><main><div id="tl" class="tl"></div></main></div>
      </section>
    </div>
  </div>

</div>

<!-- Motion, vendored rather than pulled from a CDN. The demo runs from a local
     http.server and may have no internet; a CDN miss would leave `Motion`
     undefined mid-demo. Every use below is feature-detected anyway. -->
<script src="vendor/motion.js"></script>
<script src="viewer.js"></script>
</body>
</html>
